services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test-only
      MYSQL_DATABASE: erp
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--sql-mode="]
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptest-only"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:3308:3306"
  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: erp
      DATABASE_USER: root
      DATABASE_PASSWORD: test-only
      JWT_SECRET: local-docker-test-only-not-for-production
      CORS_ORIGIN: http://localhost:3000
      ASAAS_API_URL: https://api-sandbox.asaas.com/v3
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - saas_uploads:/app/uploads

volumes:
  saas_uploads:
