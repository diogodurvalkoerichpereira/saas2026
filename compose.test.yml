services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test-only
      POSTGRES_USER: postgres
      POSTGRES_DB: erp
      TZ: America/Sao_Paulo
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5433:5432"
  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: erp
      DATABASE_USER: postgres
      DATABASE_PASSWORD: test-only
      JWT_SECRET: local-docker-test-only-not-for-production
      CORS_ORIGIN: http://localhost:3000
      ASAAS_API_URL: https://api-sandbox.asaas.com/v3
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - saas_uploads:/app/uploads

volumes:
  saas_uploads:
