<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c0710">
  <title>Portal do cliente · SaaS 2026</title>
  <link rel="stylesheet" href="/standalone.css">
  <link rel="stylesheet" href="/theme.css">
  <script type="module" src="/js/theme-toggle.mjs"></script>
</head>
<body>
  <section class="auth-shell" id="portal-login">
    <form class="auth-card" id="portal-login-form">
      <div class="brand"><span class="brand-mark">S26</span><div><strong>Portal do cliente</strong><div class="muted">Acompanhe seus serviços e cobranças</div></div></div>
      <label class="field">E-mail<input name="email" type="email" required autocomplete="username" placeholder="seu@email.com"></label>
      <label class="field">Código da empresa<input name="companyId" type="number" min="1" required placeholder="1"></label>
      <label class="field">Senha<input name="password" type="password" required autocomplete="current-password" placeholder="••••••••"></label>
      <button class="button primary" type="submit">Entrar no portal</button>
      <p class="error" id="portal-login-error"></p>
      <a href="/">Voltar ao ERP</a>
    </form>
  </section>
  <div class="shell" id="portal-app" hidden>
    <aside class="side">
      <div class="brand"><span class="brand-mark">S26</span><div><strong>Área do cliente</strong><small id="portal-company"></small></div></div>
      <nav>
        <a href="#/dashboard" data-route="dashboard">Visão geral</a>
        <a href="#/orders" data-route="orders">Ordens de serviço</a>
        <a href="#/quotes" data-route="quotes">Orçamentos</a>
        <a href="#/contracts" data-route="contracts">Contratos</a>
        <a href="#/billing" data-route="billing">Financeiro</a>
        <a href="#/profile" data-route="profile">Meu cadastro</a>
      </nav>
      <footer><strong id="portal-name"></strong><button class="button ghost" id="portal-logout">Sair</button></footer>
    </aside>
    <div class="workspace"><header class="topbar"><h1 id="portal-title">Visão geral</h1><div style="display:flex;align-items:center;gap:12px"><span class="muted">Portal seguro</span><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema claro/magenta" title="Alternar tema"><svg class="ui-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ui-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button></div></header><main class="content" id="portal-root"></main></div>
  </div>
  <dialog class="modal" id="portal-modal"><form method="dialog"><header><h2 id="portal-modal-title"></h2><button class="button ghost" value="cancel">Fechar</button></header><div id="portal-modal-body"></div></form></dialog>
  <script type="module" src="/portal.js"></script>
</body>
</html>
