<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administração SaaS · SaaS 2026</title>
  <link rel="stylesheet" href="/standalone.css">
</head>
<body>
  <section class="auth-shell" id="admin-login">
    <form class="auth-card" id="admin-login-form">
      <div class="brand"><span class="brand-mark">S26</span><div><strong>Administração SaaS</strong><div class="muted">Empresas, planos e recursos</div></div></div>
      <label class="field">E-mail<input name="email" type="email" required autocomplete="username" placeholder="seu@email.com"></label>
      <label class="field">Senha<input name="password" type="password" required autocomplete="current-password" placeholder="••••••••"></label>
      <button class="button primary">Entrar na administração</button>
      <p class="error" id="admin-login-error"></p><a href="/">Voltar ao ERP</a>
    </form>
  </section>
  <div class="shell" id="admin-app" hidden>
    <aside class="side">
      <div class="brand"><span class="brand-mark">S26</span><div><strong>Admin SaaS</strong><small>Ambiente local</small></div></div>
      <nav>
        <a href="#/dashboard" data-route="dashboard"><svg class="nav-icon" aria-hidden="true"><use href="/icons.svg#dashboard"></use></svg>Visão geral</a>
        <a href="#/companies" data-route="companies"><svg class="nav-icon" aria-hidden="true"><use href="/icons.svg#building"></use></svg>Empresas</a>
        <a href="#/plans" data-route="plans"><svg class="nav-icon" aria-hidden="true"><use href="/icons.svg#briefcase"></use></svg>Planos</a>
        <a href="#/resources" data-route="resources"><svg class="nav-icon" aria-hidden="true"><use href="/icons.svg#layers"></use></svg>Recursos</a>
        <a href="#/billing" data-route="billing"><svg class="nav-icon" aria-hidden="true"><use href="/icons.svg#wallet"></use></svg>Mensalidades</a>
        <a href="#/site" data-route="site"><svg class="nav-icon" aria-hidden="true"><use href="/icons.svg#building"></use></svg>Site e planos</a>
        <a href="#/alerts" data-route="alerts"><svg class="nav-icon" aria-hidden="true"><use href="/icons.svg#megaphone"></use></svg>Alertas</a>
        <a href="#/users" data-route="users"><svg class="nav-icon" aria-hidden="true"><use href="/icons.svg#user"></use></svg>Usuários SaaS</a>
      </nav>
      <footer><strong id="admin-name"></strong><button class="button ghost" id="admin-change-password">Alterar senha</button><button class="button ghost" id="admin-logout">Sair</button></footer>
    </aside>
    <div class="workspace"><header class="topbar"><h1 id="admin-title">Visão geral</h1><span class="muted">Administração global</span></header><main class="content" id="admin-root"></main></div>
  </div>
  <dialog class="modal" id="admin-modal"><form id="admin-modal-form"><header><h2 id="admin-modal-title"></h2><button class="button ghost" type="button" data-close>Fechar</button></header><div id="admin-modal-body"></div><p class="error" id="admin-modal-error"></p><footer><button class="button ghost" type="button" data-close>Cancelar</button><button class="button primary">Salvar</button></footer></form></dialog>
  <script type="module" src="/admin.js"></script>
</body>
</html>
