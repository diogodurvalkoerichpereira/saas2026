<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SaaS 2026</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <main class="shell">
    <section class="card" id="login-view">
      <p class="eyebrow">SaaS 2026</p><h1>Acesse o ERP</h1><p class="muted">Ambiente migrado para Node.js</p>
      <form id="login-form"><label>E-mail<input name="email" type="email" required autocomplete="username"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><button>Entrar</button><p id="login-error" class="error" role="alert"></p></form>
    </section>
    <section id="dashboard-view" hidden>
      <header><div><p class="eyebrow">Painel</p><h1 id="welcome">Visão geral</h1></div><button class="secondary" id="logout">Sair</button></header>
      <div class="grid" id="metrics"><article class="card"><span>Carregando indicadores…</span></article></div>
      <nav class="card links"><a href="#clients">Clientes</a><a href="#inventory">Estoque</a><a href="#finance">Financeiro</a><a href="#orders">Ordens de serviço</a></nav>
    </section>
  </main><script src="/app.js" defer></script>
</body></html>
